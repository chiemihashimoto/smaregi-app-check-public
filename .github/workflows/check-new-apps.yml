name: アプリマーケットの新着チェック

on:
  schedule:
    - cron: '0 0 * * 1'    # 毎週月曜 9:00（日本時間）
                           # ① 前回の一覧に出た最後の番号から前後300件 ② 前回有効だったURLが引き続き有効か
  workflow_dispatch:        # Actions の画面から手動でも実行できます
    inputs:
      mode:
        description: '確認の方式（weekly: 毎週の確認 / full: 1番から全件）'
        type: choice
        options: [weekly, full]
        default: weekly
  push:
    branches: [main]       # index.html などを更新したときも、ページを公開し直します

permissions:
  contents: write   # data/ の更新をコミットする
  issues: write     # 新着があったら Issue で知らせる
  pages: write      # GitHub Pages に公開する
  id-token: write

concurrency:
  group: check-new-apps
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリを入れる
        if: github.event_name != 'push'
        run: pip install openpyxl==3.1.5 msoffcrypto-tool==6.1.0

      - name: 最新リストを更新して新着をチェック
        id: check
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 120
        env:
          SCAN_MODE: ${{ github.event.inputs.mode || 'weekly' }}
          EXCEL_PASSWORD: ${{ secrets.EXCEL_PASSWORD }}
        run: python scripts/check_new_apps.py

      - name: 結果をコミット
        if: steps.check.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "新着チェック $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 新着・掲載終了があれば Issue で通知
        if: steps.check.outcome == 'success' && (steps.check.outputs.new_count != '0' || steps.check.outputs.gone_count != '0' || steps.check.outputs.other_count != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "アプリマーケット: 新着 ${{ steps.check.outputs.new_count }}件・見つからなくなった ${{ steps.check.outputs.gone_count }}件（$(TZ=Asia/Tokyo date '+%Y-%m-%d')）" \
            --body-file new-apps-issue.md

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/new-apps.json _site/data/   # 公開ページに必要なものだけ（Excel は載せない）

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages に公開
        id: deploy
        uses: actions/deploy-pages@v4

      - name: チェックが失敗していたら知らせる
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::新着チェックが失敗しました。上の「最新リストを更新して新着をチェック」のログを確認してください。"
          exit 1
